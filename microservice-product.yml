spring:
  application:
    name: microservice-product

  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/product_db"
    username: root
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/Microservices-Hardware-realm

server:
  port: 0

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
